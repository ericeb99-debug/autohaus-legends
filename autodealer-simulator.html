<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>AutoDealer Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AUTODEALER SUITE – UI 3.0
   Ein konsolidiertes Design-System (ersetzt alle früheren
   Stil-Generationen). Dunkles Desktop-Design nach Referenz:
   Dock links, KPI-Topbar, Karten-Panels, Programm-Launcher.
   Token-Namen der Vorversionen bleiben als Aliase erhalten,
   da Spiellogik-Renderer sie inline referenzieren.
   ============================================================ */

/* ---------- 1. TOKENS ---------- */
:root{
  /* Flächen */
  --bg-0:#07090d;
  --bg-1:#0b0e14;
  --bg-2:#10141c;
  --panel:#12161f;
  --panel-hi:#171c27;
  --surface:rgba(255,255,255,.045);
  --surface-hi:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.07);
  --line-hi:rgba(255,255,255,.16);
  /* Text */
  --ink-0:#eef1f6;
  --ink-1:#9aa4b5;
  --ink-2:#657084;
  /* Akzente */
  --brass:#d8ac52;          /* Gold – Marke, Preise, Primäraktion */
  --brass-ink:#241a06;
  --brass-dim:rgba(216,172,82,.14);
  --emerald:#3ecf7f;        /* Positiv, Geld rein */
  --emerald-dim:rgba(62,207,127,.13);
  --crimson:#f0616b;        /* Negativ, überfällig */
  --crimson-dim:rgba(240,97,107,.13);
  --violet:#a06bff;         /* Legacy, Prestige */
  --violet-dim:rgba(160,107,255,.14);
  --blue:#4d8cff;           /* Info, Links */
  --blue-dim:rgba(77,140,255,.14);
  --ui-primary:var(--blue);
  /* Aliase früherer Generationen (von Inline-Styles referenziert) */
  --amber:var(--brass); --amber-dim:var(--brass-dim);
  --teal:var(--emerald); --teal-dim:var(--emerald-dim);
  --red:var(--crimson); --red-dim:var(--crimson-dim);
  --glass:var(--surface); --glass-brd:var(--line); --glass-brd-hi:var(--line-hi);
  --txt-0:var(--ink-0); --txt-1:var(--ink-1); --txt-2:var(--ink-2);
  --dash-blue:var(--blue);
  --ref-bg:var(--bg-0); --ref-panel:var(--panel); --ref-panel-hi:var(--panel-hi);
  --ref-line:var(--line); --ref-line-hi:var(--line-hi);
  --ref-text:var(--ink-0); --ref-muted:var(--ink-1); --ref-dim:var(--ink-2);
  --ref-gold:var(--brass); --ref-green:var(--emerald); --ref-red:var(--crimson);
  --ref-purple:var(--violet); --ref-blue:var(--blue);
  /* Geometrie & Schrift */
  --radius:16px;
  --radius-sm:12px;
  --font-d:'Manrope',sans-serif;
  --font-b:'Inter',sans-serif;
  --font-m:'JetBrains Mono',monospace;
  --dock-w:94px;
  --top-h:76px;
  --bottom-h:58px;
  --shadow-1:0 14px 34px rgba(0,0,0,.34);
  --shadow-2:0 30px 80px rgba(0,0,0,.55);
}
body.theme-light{
  --bg-0:#eef1f4;
  --bg-1:#f5f7f9;
  --bg-2:#e4e8ee;
  --panel:#ffffff;
  --panel-hi:#f6f8fb;
  --surface:rgba(15,23,42,.045);
  --surface-hi:rgba(15,23,42,.08);
  --line:rgba(15,23,42,.10);
  --line-hi:rgba(15,23,42,.22);
  --ink-0:#1c2534;
  --ink-1:#51607a;
  --ink-2:#7d8aa1;
  --brass:#a87a22;
  --brass-ink:#fff7e6;
  --brass-dim:rgba(168,122,34,.12);
  --emerald:#118a56;
  --emerald-dim:rgba(17,138,86,.11);
  --crimson:#c4404b;
  --crimson-dim:rgba(196,64,75,.11);
  --violet:#6a48d7;
  --violet-dim:rgba(106,72,215,.12);
  --blue:#2b6de0;
  --blue-dim:rgba(43,109,224,.12);
  --shadow-1:0 12px 30px rgba(35,48,72,.12);
  --shadow-2:0 26px 70px rgba(35,48,72,.20);
}

/* ---------- 2. BASIS ---------- */
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:var(--font-b);
  font-size:13px;
  color:var(--ink-0);
  letter-spacing:.1px;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  background:
    radial-gradient(1000px 640px at 8% -6%, rgba(216,172,82,.06), transparent 55%),
    radial-gradient(900px 620px at 100% 0%, rgba(77,140,255,.05), transparent 55%),
    linear-gradient(180deg,var(--bg-0),var(--bg-1) 52%, var(--bg-0));
}
body.theme-light{
  background:
    radial-gradient(1000px 640px at 8% -6%, rgba(168,122,34,.07), transparent 55%),
    radial-gradient(900px 620px at 100% 0%, rgba(43,109,224,.06), transparent 55%),
    linear-gradient(180deg,var(--bg-1),var(--bg-0) 52%, var(--bg-2));
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.22);border-radius:20px;}
::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.34);}
a{color:var(--blue);}

/* ---------- 3. SHELL-LAYOUT ---------- */
#app{
  position:relative;width:100%;height:100vh;
  display:grid;
  grid-template-columns:var(--dock-w) minmax(0,1fr);
  grid-template-rows:var(--top-h) minmax(0,1fr) var(--bottom-h);
}
#sidebar{grid-column:1;grid-row:1 / -1;}
#topbar{grid-column:2;grid-row:1;}
#shell{display:contents;}
#mainpane{
  grid-column:2;grid-row:2;
  display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;
}
#bottomBar{grid-column:2;grid-row:3;}
#pagecontent{
  flex:1;overflow-y:auto;padding:22px 26px 26px;
  animation:pagefade .18s ease;
}
@keyframes pagefade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
/* Login-Screen ersetzt das komplette Raster */
.profile-screen{
  grid-column:1 / -1;grid-row:1 / -1;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;
}

/* ---------- 4. TOPBAR ---------- */
#topbar{
  display:flex;align-items:center;gap:18px;
  padding:0 22px;min-width:0;
  background:color-mix(in srgb, var(--bg-1) 82%, transparent);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}
.ref-brand{display:flex;align-items:center;gap:12px;min-width:0;flex:0 1 auto;}
.ref-brand-mark{
  width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
  color:var(--brass-ink);font:800 13px/1 var(--font-d);
  background:linear-gradient(135deg,#eccf8d,var(--brass));
  box-shadow:0 10px 26px rgba(216,172,82,.28), inset 0 1px 0 rgba(255,255,255,.4);
}
.ref-brand-copy{min-width:0;}
.ref-brand-copy b{display:block;color:var(--ink-0);font:800 16px/1.15 var(--font-d);white-space:nowrap;}
.ref-brand-copy small{display:block;margin-top:2px;color:var(--ink-2);font-size:11px;white-space:nowrap;}
.top-day{
  display:flex;flex-direction:column;gap:5px;min-width:118px;flex:0 0 auto;
  padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
}
.top-day b{font:700 12.5px/1 var(--font-m);color:var(--ink-0);white-space:nowrap;}
.top-day small{display:none;}
.day-clock-track{display:block;height:3px;border-radius:99px;background:rgba(148,163,184,.18);overflow:hidden;}
.day-clock-fill{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--brass),#ecd19d);transition:width .25s linear;}
.top-metrics{
  margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden;
}
.top-metric{
  display:flex;align-items:center;gap:10px;white-space:nowrap;
  padding:8px 14px 8px 9px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);
}
.top-metric .mi{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
  color:var(--brass);background:color-mix(in srgb, currentColor 14%, transparent);
}
.top-metric .mi svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.top-metric b{display:block;color:var(--ink-0);font:700 13.5px/1.15 var(--font-m);font-variant-numeric:tabular-nums;}
.top-metric small{display:block;margin-top:2px;color:var(--ink-2);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.top-metric .pos{color:var(--emerald);}
.top-metric .neg{color:var(--crimson);}
.top-spark{display:none;}
.top-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.top-icon-btn{
  position:relative;width:42px;height:42px;border-radius:12px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-1);
  display:grid;place-items:center;transition:.15s all;
}
.top-icon-btn:hover{border-color:var(--line-hi);background:var(--surface-hi);color:var(--ink-0);}
.top-icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.top-icon-btn.has-unread{border-color:rgba(216,172,82,.5);color:var(--brass);animation:bellpulse 1.8s ease-in-out infinite;}
@keyframes bellpulse{0%,100%{box-shadow:0 0 0 0 rgba(216,172,82,.32);}50%{box-shadow:0 0 0 6px rgba(216,172,82,0);}}
.bell-badge{
  position:absolute;top:-6px;right:-6px;background:var(--crimson);color:#fff;border-radius:20px;
  font:700 10px/1.45 var(--font-m);padding:1px 5px;min-width:17px;text-align:center;
  box-shadow:0 0 0 2px var(--bg-0);
}
.top-profile{
  display:flex;align-items:center;gap:10px;height:48px;padding:6px 14px 6px 7px;cursor:pointer;
  border-radius:13px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-0);font-family:var(--font-b);text-align:left;transition:.15s all;
}
.top-profile:hover{border-color:var(--line-hi);background:var(--surface-hi);}
.top-profile b{display:block;font-size:12.5px;font-weight:700;}
.top-profile small{display:block;margin-top:1px;color:var(--ink-2);font-size:10.5px;}
.window-controls{display:flex;gap:7px;margin-left:4px;}
.window-controls span{width:11px;height:11px;border-radius:50%;background:var(--surface-hi);border:1px solid var(--line);font-size:0;}
.window-controls span:nth-child(1){background:#f26d6d;border-color:transparent;opacity:.75;}
.window-controls span:nth-child(2){background:#f0c04c;border-color:transparent;opacity:.75;}
.window-controls span:nth-child(3){background:#3ecf7f;border-color:transparent;opacity:.75;}

/* ---------- 5. DOCK (Sidebar) ---------- */
#sidebar, .ref-dock{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px 10px 12px;overflow:hidden;
  background:color-mix(in srgb, var(--bg-1) 88%, transparent);
  border-right:1px solid var(--line);
}
.dock-logo{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;
  color:var(--brass-ink);font:800 13px/1 var(--font-d);margin-bottom:8px;
  background:linear-gradient(135deg,#eccf8d,var(--brass));
  box-shadow:0 10px 26px rgba(216,172,82,.26), inset 0 1px 0 rgba(255,255,255,.4);
}
.dock-list{
  display:grid;gap:5px;width:100%;justify-items:center;
  overflow-y:auto;overflow-x:hidden;scrollbar-width:none;min-height:0;
}
.dock-list::-webkit-scrollbar{display:none;}
.dock-item{
  position:relative;width:70px;min-height:58px;padding:8px 2px 7px;
  display:grid;justify-items:center;align-content:center;gap:5px;
  border-radius:13px;color:var(--ink-2);cursor:pointer;user-select:none;
  transition:.15s background,.15s color;
}
.dock-item:hover{background:var(--surface);color:var(--ink-1);}
.dock-item.active{background:var(--brass-dim);color:var(--brass);}
.dock-item.active::after{
  content:"";position:absolute;left:-10px;top:14px;bottom:14px;width:3px;border-radius:99px;
  background:var(--brass);box-shadow:0 0 16px rgba(216,172,82,.7);
}
.dock-item svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.dock-item .lbl{
  font-size:9.5px;font-weight:700;max-width:66px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
}
.dock-item .badge{top:2px;right:8px;}
.dock-spacer{flex:1;min-height:8px;}
.dock-ring{
  width:64px;display:grid;justify-items:center;gap:5px;flex:0 0 auto;cursor:pointer;
  color:var(--ink-2);font-size:9.5px;font-weight:700;padding-bottom:2px;
}
.dock-ring .ring{
  --p:75;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--blue) calc(var(--p)*1%), rgba(148,163,184,.15) 0);
}
.dock-ring .ring span{
  width:35px;height:35px;border-radius:50%;display:grid;place-items:center;
  background:var(--bg-1);color:var(--ink-0);font:800 11px/1 var(--font-m);
}
body.theme-light .dock-ring .ring span{background:var(--panel);}

/* ---------- 6. BOTTOM BAR ---------- */
#bottomBar, .bottom-bar{
  display:flex;align-items:center;gap:12px;padding:8px 18px;min-width:0;
  background:color-mix(in srgb, var(--bg-1) 88%, transparent);
  border-top:1px solid var(--line);
}
.bottom-logo{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;
  color:var(--brass-ink);font:800 11px/1 var(--font-d);
  background:linear-gradient(135deg,#eccf8d,var(--brass));
}
.bottom-title b{display:block;color:var(--ink-0);font-size:12px;font-weight:800;white-space:nowrap;}
.bottom-title small{display:block;color:var(--ink-2);font-size:10px;}
.bottom-tabs{display:flex;gap:8px;margin-left:26px;min-width:0;overflow:hidden;}
.bottom-tab{
  min-width:120px;height:40px;border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 14px;
  color:var(--ink-1);background:var(--surface);border:1px solid transparent;cursor:pointer;
  font-size:12px;font-weight:600;white-space:nowrap;transition:.15s all;
}
.bottom-tab:hover{color:var(--ink-0);background:var(--surface-hi);}
.bottom-tab.active{color:var(--brass);background:var(--brass-dim);border-color:rgba(216,172,82,.3);}
.bottom-tools{margin-left:auto;display:flex;gap:9px;align-items:center;color:var(--ink-1);flex:0 0 auto;}
.bottom-tool{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);transition:.15s all;
}
.bottom-tool:hover{border-color:var(--line-hi);color:var(--ink-0);}
.bottom-tab svg,.bottom-tool svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;}
.bottom-date{text-align:right;color:var(--ink-0);font:700 12px/1.35 var(--font-m);}
.bottom-date small{display:block;color:var(--ink-2);font:500 10px/1.2 var(--font-b);}
.savebadge{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-size:10.5px;margin-left:14px;min-width:0;}
.savebadge small{display:block;color:var(--ink-2);font-size:9.5px;}
.savebadge b{color:var(--ink-1);font-size:10.5px;}
.savebadge .sdot{width:7px;height:7px;border-radius:50%;background:var(--emerald);flex:0 0 auto;}
.saved-pulse .sdot{animation:savedpulse .9s ease;}
@keyframes savedpulse{0%{box-shadow:0 0 0 0 rgba(62,207,127,.5);}100%{box-shadow:0 0 0 8px rgba(62,207,127,0);}}

/* ---------- 7. PROGRAMM-LAUNCHER ---------- */
.program-overlay{position:fixed;inset:0;z-index:760;background:rgba(3,5,9,.52);backdrop-filter:blur(5px);}
body.theme-light .program-overlay{background:rgba(30,41,59,.28);}
.program-window{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(880px,calc(100vw - 40px));max-height:min(680px,calc(100vh - 60px));
  display:flex;flex-direction:column;border-radius:18px;overflow:hidden;
  border:1px solid var(--line-hi);
  background:linear-gradient(170deg,var(--panel-hi),var(--panel));
  box-shadow:var(--shadow-2), inset 0 1px 0 rgba(255,255,255,.06);
  animation:programin .2s cubic-bezier(.2,.9,.3,1);
}
@keyframes programin{from{opacity:0;transform:translate(-50%,-48.5%) scale(.98);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}
.program-head{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,300px) 38px;
  gap:12px;align-items:center;padding:20px 22px 12px;
}
.program-title b{display:block;color:var(--ink-0);font:800 20px/1.1 var(--font-d);}
.program-title small{display:block;margin-top:4px;color:var(--ink-1);font-size:11.5px;}
.program-search{
  height:38px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-0);padding:0 12px;outline:none;
  font-family:var(--font-b);font-size:12.5px;
}
.program-search:focus{border-color:rgba(216,172,82,.5);}
.program-close{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--line);cursor:pointer;
  background:var(--surface);color:var(--ink-0);font-size:15px;
}
.program-close:hover{background:var(--surface-hi);}
.program-body{padding:0 22px 22px;overflow:auto;}
.program-section-title{margin:14px 0 10px;color:var(--ink-2);font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;}
.program-grid{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:11px;}
.program-card{
  --app-a:var(--blue);position:relative;min-height:106px;border-radius:13px;padding:14px;
  display:grid;align-content:start;gap:8px;cursor:pointer;color:var(--ink-0);
  background:linear-gradient(150deg,color-mix(in srgb,var(--app-a) 10%, var(--surface)),var(--surface));
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  transition:.16s ease;
}
.program-card:hover{
  transform:translateY(-2px);
  border-color:color-mix(in srgb,var(--app-a) 45%, var(--line));
  background:linear-gradient(150deg,color-mix(in srgb,var(--app-a) 17%, var(--surface)),var(--surface-hi));
}
.program-icon{
  width:42px;height:42px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--app-a),color-mix(in srgb,var(--app-a) 55%, #fff));
  box-shadow:0 12px 24px color-mix(in srgb,var(--app-a) 22%, transparent);
}
.program-icon svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.program-card b{font-size:12.5px;line-height:1.2;}
.program-card small{color:var(--ink-1);font-size:10.5px;line-height:1.3;}
.program-card .badge{top:10px;right:10px;}
.program-empty{padding:24px;color:var(--ink-2);text-align:center;border:1px dashed var(--line-hi);border-radius:12px;}

/* ---------- 8. KERN-KOMPONENTEN ---------- */
h2.section-title{font-family:var(--font-d);font-size:19px;font-weight:800;margin:0 0 4px;letter-spacing:-.1px;}
.subtle{color:var(--ink-1);font-size:12.5px;margin:0 0 16px;line-height:1.45;}
.btn{
  font-family:var(--font-b);font-weight:600;font-size:13px;border:none;cursor:pointer;
  padding:9px 16px;border-radius:11px;display:inline-flex;align-items:center;gap:7px;
  transition:.15s transform,.15s background,.15s box-shadow,.15s border-color;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(180deg,#ecc987,var(--brass));color:var(--brass-ink);box-shadow:0 4px 16px rgba(216,172,82,.24);}
.btn-primary:hover{box-shadow:0 6px 20px rgba(216,172,82,.36);}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink-0);}
.btn-ghost:hover{border-color:var(--line-hi);background:var(--surface-hi);}
.btn-danger{background:var(--crimson-dim);color:var(--crimson);border:1px solid color-mix(in srgb,var(--crimson) 35%, transparent);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:9px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.chip{
  font-size:10.5px;padding:3px 8px;border-radius:20px;background:var(--surface);
  border:1px solid var(--line);color:var(--ink-1);font-weight:500;
}
.badge{
  position:absolute;top:-6px;right:-6px;background:var(--crimson);color:#fff;border-radius:20px;
  font:800 11px/1.4 var(--font-m);padding:2px 6px;min-width:19px;text-align:center;z-index:50;
  box-shadow:0 0 0 2px var(--bg-0), 0 2px 8px rgba(240,97,107,.55);
  animation:badgepulse 1.4s ease-in-out infinite;
}
@keyframes badgepulse{0%,100%{transform:scale(1);}50%{transform:scale(1.14);}}
.avatar{
  width:38px;height:38px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(135deg,#eccf8d,var(--brass));
  display:flex;align-items:center;justify-content:center;
  font:800 13px/1 var(--font-d);color:var(--brass-ink);
}
.card{
  position:relative;background:linear-gradient(165deg,var(--panel-hi),var(--panel));
  border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:14px;padding-top:16px;overflow:hidden;
  transition:.15s border-color,.18s transform,.18s box-shadow;
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--tier-color,transparent);}
.card:hover{border-color:var(--line-hi);transform:translateY(-2px);box-shadow:var(--shadow-1);}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px;margin-bottom:20px;}
.stat-card{
  background:linear-gradient(165deg,var(--panel-hi),var(--panel));
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:15px;transition:.15s border-color;
}
.stat-card:hover{border-color:var(--line-hi);}
.stat-card .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);font-weight:700;margin-bottom:7px;}
.stat-card .num{font-family:var(--font-m);font-size:20px;font-weight:700;color:var(--ink-0);font-variant-numeric:tabular-nums;}
.progress{height:7px;background:rgba(148,163,184,.16);border-radius:5px;overflow:hidden;margin-top:8px;}
.progress > div{height:100%;background:linear-gradient(90deg,var(--violet),var(--emerald));}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;color:var(--ink-1);margin-bottom:6px;font-weight:600;}
.field input[type=range]{width:100%;accent-color:var(--brass);}
.field input[type=number],.field input[type=text],.field input[type=password],.field select,textarea{
  width:100%;padding:9px 11px;border-radius:10px;background:var(--surface);
  border:1px solid var(--line);color:var(--ink-0);font-family:var(--font-m);font-size:13px;
}
textarea{font-family:var(--font-b);resize:vertical;}
.field select{font-family:var(--font-b);}
.field select option{background:var(--panel);color:var(--ink-0);}
.field input:focus,.field select:focus,textarea:focus{outline:none;border-color:rgba(216,172,82,.55);background:var(--brass-dim);}
.notice{
  padding:11px 13px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  font-size:12.5px;margin-bottom:10px;display:flex;gap:9px;align-items:flex-start;line-height:1.4;
}
.notice.warn{background:var(--crimson-dim);border-color:color-mix(in srgb,var(--crimson) 32%, transparent);}
.notice.good{background:var(--emerald-dim);border-color:color-mix(in srgb,var(--emerald) 32%, transparent);}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
table.tbl th{text-align:left;color:var(--ink-2);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line);}
table.tbl td{padding:10px;border-bottom:1px solid var(--line);}
table.tbl tr:hover td{background:var(--surface);}
.empty-state{text-align:center;padding:50px 20px;color:var(--ink-2);}
.empty-state .ic{font-size:34px;margin-bottom:10px;}
.pill-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.pill-tab{
  padding:7px 13px;border-radius:20px;background:var(--surface);border:1px solid var(--line);
  font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-1);transition:.15s all;
}
.pill-tab:hover{border-color:var(--line-hi);}
.pill-tab.active{background:var(--brass-dim);border-color:rgba(216,172,82,.4);color:var(--brass);}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;}
.row-actions .btn{flex:1;justify-content:center;}
.tag-warn{color:var(--crimson);font-size:10.5px;font-weight:600;}
.pos{color:var(--emerald);}
.neg{color:var(--crimson);}
.persona{font-size:10.5px;padding:2px 8px;border-radius:20px;background:var(--violet-dim);color:var(--violet);font-weight:600;}
.offer-card{border-radius:13px;background:linear-gradient(165deg,var(--panel-hi),var(--panel));border:1px solid var(--line);padding:14px;margin-bottom:10px;}
.offer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;}
.employee-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;transition:.15s border-color;}
.employee-row:hover{border-color:var(--line-hi);}

/* ---------- 9. FAHRZEUGKARTEN ---------- */
.grid-cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:13px;}
.tier-tag{
  z-index:4;position:absolute;top:10px;right:10px;
  font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 8px;border-radius:20px;background:color-mix(in srgb, var(--bg-0) 85%, transparent);
  color:var(--tier-color,var(--ink-1));border:1px solid var(--tier-color,var(--line));
  backdrop-filter:blur(10px);
}
.car-media{
  position:relative;height:128px;border-radius:11px;margin-bottom:11px;
  display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;
  background:linear-gradient(150deg,color-mix(in srgb, var(--tier-color,#8a94a6) 18%, transparent),var(--surface));
  border:1px solid var(--line);
}
.car-media::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 65%,color-mix(in srgb,var(--tier-color,#8a94a6) 14%, transparent),transparent 48%);pointer-events:none;}
.photo-source{
  position:absolute;left:8px;bottom:8px;z-index:2;font-size:9px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 7px;border-radius:20px;background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.82);backdrop-filter:blur(8px);
}
.car-name{font-family:var(--font-d);font-weight:800;font-size:14.5px;margin-bottom:2px;color:var(--ink-0);}
.car-sub{color:var(--ink-1);font-size:11.5px;margin-bottom:9px;}
.spec-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.price-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:8px;}
.price{font-family:var(--font-m);font-weight:700;font-size:16.5px;color:var(--brass);}
.mval{font-size:10.5px;color:var(--ink-2);}
.cond-bar{height:5px;border-radius:4px;background:rgba(148,163,184,.16);overflow:hidden;margin-bottom:9px;}
.cond-fill{height:100%;background:linear-gradient(90deg,var(--crimson),var(--brass),var(--emerald));}
.inventory-card-actions{
  display:grid!important;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));
  gap:8px!important;align-items:stretch;
}
.inventory-card-actions .btn{width:100%;min-width:0;height:auto;white-space:normal;line-height:1.2;}
.market-search-banner{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:13px 16px;margin-bottom:14px;border-radius:13px;
  background:linear-gradient(150deg,var(--brass-dim),var(--surface));
  border:1px solid rgba(216,172,82,.35);font-size:12.5px;line-height:1.5;
}
.market-search-banner .hit{color:var(--brass);font-weight:700;font-size:11.5px;}
.market-match-badge{
  position:absolute;top:10px;left:10px;z-index:5;font-size:9px;font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;border-radius:20px;
  background:var(--brass);color:var(--brass-ink);box-shadow:0 6px 16px rgba(216,172,82,.4);
}
.market-highlight{border-color:rgba(216,172,82,.65)!important;}
.market-highlight.pulse{animation:matchpulse 1.6s ease-in-out infinite;}
@keyframes matchpulse{0%,100%{box-shadow:0 0 0 0 rgba(216,172,82,.32);}50%{box-shadow:0 0 0 7px rgba(216,172,82,0);}}

/* Prozeduraler SVG-Fahrzeugrenderer (datengetrieben, unverändert übernommen) */
.body-shape{position:relative;z-index:1;width:100%;height:100%;filter:drop-shadow(0 18px 22px rgba(0,0,0,.45));transition:.22s transform,.22s filter;}
.card:hover .body-shape,.dash-car-card:hover .body-shape{transform:translateY(-2px) scale(1.025);filter:drop-shadow(0 20px 26px rgba(0,0,0,.52));}
.body-shape .ground{fill:rgba(0,0,0,.25);}
.body-shape .paint{stroke:rgba(255,255,255,.32);stroke-width:1.2;stroke-linejoin:round;}
.body-shape .lower{fill:rgba(5,8,13,.42);}
.body-shape .glass{stroke:rgba(255,255,255,.45);stroke-width:1.1;stroke-linejoin:round;}
.body-shape .trim,.body-shape .cut{stroke:rgba(255,255,255,.44);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.body-shape .cut{opacity:.55;stroke-width:1.15;}
.body-shape .shine{fill:none;stroke:rgba(255,255,255,.48);stroke-width:2.2;stroke-linecap:round;opacity:.72;}
.body-shape .lamp{fill:#f5f1d0;filter:drop-shadow(0 0 5px rgba(94,190,255,.28));}
.body-shape .tail{fill:#ff566b;filter:drop-shadow(0 0 5px rgba(255,86,107,.25));}
.body-shape .signature{fill:none;stroke:#78d8ff;stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(120,216,255,.4));}
.body-shape .tire{fill:#070a0f;stroke:rgba(255,255,255,.27);stroke-width:3;}
.body-shape .rim{stroke:rgba(255,255,255,.38);stroke-width:1.2;}
.body-shape .hub{fill:rgba(12,18,26,.92);}
.body-shape .spoke{stroke:rgba(255,255,255,.66);stroke-width:1.6;stroke-linecap:round;}
.body-shape .accent{stroke:var(--tier-color,#8b7ff0);stroke-width:2.1;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 7px color-mix(in srgb,var(--tier-color,#8b7ff0) 45%, transparent));}
.body-shape .rail,.body-shape .detail{stroke:rgba(218,228,240,.6);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.body-shape .badge-dot{fill:var(--tier-color,#8b7ff0);filter:drop-shadow(0 0 5px color-mix(in srgb,var(--tier-color,#8b7ff0) 55%, transparent));}
body.theme-light .body-shape{filter:drop-shadow(0 16px 18px rgba(37,48,56,.22));}
body.theme-light .body-shape .tire{fill:#1f211f;stroke:rgba(255,255,255,.72);}

/* ---------- 10. DASHBOARD ---------- */
.dashboard-premium{display:grid;gap:13px;color:var(--ink-0);}
.ref-section-title{
  color:var(--ink-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
  font-weight:800;margin:2px 0 0 2px;
}
.dash-kpi-grid{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:11px;}
.dash-kpi,.dash-panel,.bottom-status > div{
  border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(165deg,var(--panel-hi),var(--panel));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.dash-kpi{min-height:112px;padding:16px;display:grid;align-content:start;gap:8px;transition:.15s border-color;}
.dash-kpi:hover{border-color:var(--line-hi);}
.dash-kpi-head{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
.dash-icon{
  display:grid;place-items:center;width:28px;height:28px;border-radius:8px;flex:0 0 auto;
  background:var(--surface);color:var(--brass);font:800 10px/1 var(--font-d);
}
.dash-kpi.green .dash-icon{color:var(--emerald);background:var(--emerald-dim);}
.dash-kpi.blue .dash-icon{color:var(--blue);background:var(--blue-dim);}
.dash-kpi.purple .dash-icon{color:var(--violet);background:var(--violet-dim);}
.dash-kpi.gold .dash-icon{color:var(--brass);background:var(--brass-dim);}
.dash-kpi-value{color:var(--ink-0);font:800 clamp(19px,1.5vw,26px)/1.05 var(--font-m);font-variant-numeric:tabular-nums;}
.dash-kpi-meta{font-size:11px;font-weight:700;}
.dash-kpi-chart{margin-top:auto;opacity:.9;min-height:0;}
.dash-kpi-chart svg{display:block;max-width:100%;}
.dash-main-grid{
  display:grid;grid-template-columns:minmax(280px,.9fr) minmax(340px,1.15fr) minmax(260px,.8fr);
  gap:11px;align-items:start;
}
.dash-left,.dash-right,.dash-orders{display:grid;gap:11px;min-width:0;}
.dash-panel{padding:16px;min-width:0;}
.dash-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.dash-panel-head b{color:var(--ink-0);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;}
.dash-panel-head b strong{color:var(--brass);margin-left:4px;}
.dash-panel-head button,.dash-range-btn{
  min-height:28px;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600;
  background:var(--surface);color:var(--ink-1);border:1px solid var(--line);transition:.15s all;
}
.dash-panel-head button:hover,.dash-range-btn:hover{color:var(--ink-0);border-color:var(--line-hi);}
/* Aufgabenliste */
.tasks-panel{display:grid;gap:8px;}
.task-row{
  display:grid;grid-template-columns:36px minmax(0,1fr);grid-template-rows:auto auto;gap:1px 11px;
  align-items:center;padding:10px 12px;border-radius:11px;cursor:default;
  border:1px solid var(--line);background:var(--surface);
}
.task-row span:first-child{
  grid-row:1 / span 2;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;
  font:800 10px/1 var(--font-d);background:var(--surface-hi);color:var(--ink-1);
}
.task-row.blue span:first-child{color:var(--blue);background:var(--blue-dim);}
.task-row.green span:first-child{color:var(--emerald);background:var(--emerald-dim);}
.task-row.gold span:first-child{color:var(--brass);background:var(--brass-dim);}
.task-row.red span:first-child{color:var(--crimson);background:var(--crimson-dim);}
.task-row b{font-size:12.5px;color:var(--ink-0);}
.task-row small{color:var(--ink-2);font-size:11px;}
/* Umsatz-Chart */
.revenue-total{
  font:800 22px/1.2 var(--font-m);color:var(--ink-0);margin-bottom:14px;
  display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums;
}
.revenue-total .pos{font-size:11.5px;font-weight:700;}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px;}
.bar-col{
  position:relative;flex:1;min-width:0;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;gap:6px;outline:none;
}
.bar-col span{
  display:block;width:100%;max-width:30px;border-radius:6px 6px 3px 3px;
  background:linear-gradient(180deg,#ecc987,var(--brass));opacity:.75;transition:.15s opacity,.15s box-shadow;
}
.bar-col:hover span,.bar-col:focus span{opacity:1;box-shadow:0 0 18px rgba(216,172,82,.35);}
.bar-col small{color:var(--ink-2);font-size:9.5px;white-space:nowrap;}
.bar-tooltip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);z-index:30;
  display:none;white-space:nowrap;text-align:left;font-style:normal;font-size:11px;line-height:1.55;
  padding:9px 11px;border-radius:10px;background:var(--panel-hi);border:1px solid var(--line-hi);
  color:var(--ink-1);box-shadow:var(--shadow-1);
}
.bar-tooltip b{color:var(--ink-0);}
.bar-col:hover .bar-tooltip,.bar-col:focus .bar-tooltip{display:block;}
/* Fahrzeugbestand-Panel */
.inventory-panel{min-height:300px;}
.dash-car-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.dash-car-card{
  position:relative;border-radius:12px;padding:12px;cursor:pointer;min-width:0;
  border:1px solid var(--line);background:var(--surface);transition:.15s border-color,.15s transform;
}
.dash-car-card:hover{border-color:var(--line-hi);transform:translateY(-2px);}
.dash-car-card .car-media{height:92px;font-size:26px;margin-bottom:9px;}
.dash-car-name{font-family:var(--font-d);font-weight:800;font-size:13px;color:var(--ink-0);}
.dash-car-sub{color:var(--ink-2);font-size:10.5px;margin:2px 0 6px;}
.dash-car-price{font:700 14.5px/1 var(--font-m);color:var(--brass);margin-bottom:5px;}
.dash-listing-meta{color:var(--ink-2);font-size:10px;margin-bottom:8px;min-height:12px;}
.dash-car-foot{
  display:flex;justify-content:space-between;gap:8px;padding-top:8px;margin-top:2px;
  border-top:1px solid var(--line);font-size:10px;color:var(--ink-2);line-height:1.5;
}
.dash-car-foot b{font-size:11.5px;color:var(--ink-0);}
.dash-listing-badge{
  position:absolute;top:8px;right:8px;z-index:5;font-size:8.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.05em;padding:3px 7px;border-radius:20px;
  background:var(--surface-hi);color:var(--ink-1);border:1px solid var(--line-hi);
}
.dash-listing-badge.listed{color:var(--emerald);background:var(--emerald-dim);border-color:color-mix(in srgb,var(--emerald) 38%, transparent);}
.dash-listing-badge.reserved{color:var(--brass);background:var(--brass-dim);border-color:rgba(216,172,82,.4);}
.dash-listing-badge.prep{color:var(--blue);background:var(--blue-dim);border-color:color-mix(in srgb,var(--blue) 38%, transparent);}
.dash-listing-badge.sold{color:var(--violet);background:var(--violet-dim);border-color:color-mix(in srgb,var(--violet) 38%, transparent);}
.dash-listing-action{width:100%;justify-content:center;margin-top:8px;}
/* Nachrichten & Bewertungen */
.dash-side-panel{min-width:0;}
.dash-message-list{display:grid;gap:8px;}
.dash-message{
  display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:9px 11px;border-radius:11px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);transition:.15s border-color;
}
.dash-message:hover{border-color:var(--line-hi);}
.dash-message .avatar{width:34px;height:34px;font-size:11px;}
.dash-message span:nth-child(2){min-width:0;}
.dash-message b{display:block;font-size:12px;color:var(--ink-0);}
.dash-message small{display:block;color:var(--ink-2);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dash-message em{font-style:normal;color:var(--ink-2);font-size:9.5px;white-space:nowrap;}
.review-score{display:flex;align-items:baseline;gap:9px;margin-bottom:12px;}
.review-score strong{font:800 30px/1 var(--font-m);color:var(--ink-0);}
.review-score .stars{color:var(--brass);letter-spacing:2px;font-size:13px;}
.review-score small{color:var(--ink-2);font-size:10.5px;}
.stars{color:var(--brass);}
.rating-bars{display:grid;gap:6px;margin-bottom:12px;}
.rating-row{display:grid;grid-template-columns:56px minmax(0,1fr) 36px;gap:9px;align-items:center;font-size:10.5px;color:var(--ink-2);}
.rating-row > div{height:6px;border-radius:99px;background:rgba(148,163,184,.16);overflow:hidden;}
.rating-row i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ecc987,var(--brass));}
.rating-row b{text-align:right;color:var(--ink-1);font-family:var(--font-m);font-size:10px;}
.latest-review{
  display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:flex-start;
  padding:10px 11px;border-radius:11px;border:1px solid var(--line);background:var(--surface);
}
.latest-review .avatar{width:32px;height:32px;font-size:10.5px;}
.latest-review b{display:block;font-size:11.5px;color:var(--ink-0);}
.latest-review small{display:block;color:var(--ink-1);font-size:10.5px;line-height:1.45;margin-top:2px;}
/* Status-Kacheln unten */
.dash-lower-grid{display:block;}
.bottom-status{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;}
.bottom-status > div{
  min-height:76px;padding:12px;display:grid;
  grid-template-columns:34px minmax(0,1fr);grid-template-rows:auto auto auto;gap:1px 11px;align-content:center;
}
.bottom-status > div b{font-size:10px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.bottom-status > div strong{font:800 16px/1.2 var(--font-m);color:var(--ink-0);}
.bottom-status > div small{color:var(--ink-2);font-size:10px;}
.status-ico{
  grid-row:1 / span 3;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font:800 10px/1 var(--font-d);background:var(--surface-hi);color:var(--ink-1);align-self:center;
}
.status-ico.green{color:var(--emerald);background:var(--emerald-dim);}
.status-ico.orange,.status-ico.gold{color:var(--brass);background:var(--brass-dim);}
.status-ico.purple{color:var(--violet);background:var(--violet-dim);}
.status-ico.blue{color:var(--blue);background:var(--blue-dim);}
.status-ico.red{color:var(--crimson);background:var(--crimson-dim);}
/* KPI-Varianten: Ring (Erfolgsquote) und Stern (Legacy) */
.kpi-split{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px;}
.kpi-ring{--p:0;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  background:conic-gradient(var(--emerald) calc(var(--p)*1%), rgba(148,163,184,.15) 0);}
.kpi-ring span{width:42px;height:42px;border-radius:50%;background:var(--panel);}
.kpi-star{width:54px;height:54px;display:grid;place-items:center;flex:0 0 auto;color:var(--violet);
  filter:drop-shadow(0 0 14px rgba(160,107,255,.5));}
.kpi-star svg{width:36px;height:36px;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round;
  fill:color-mix(in srgb,var(--violet) 32%, transparent);}
/* Aktuelle Aufträge */
.order-list{display:grid;gap:8px;}
.order-row{
  display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:11px;align-items:center;
  padding:10px 12px;border-radius:11px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);transition:.15s border-color;
}
.order-row:hover{border-color:var(--line-hi);}
.order-row .avatar{width:36px;height:36px;font-size:11.5px;}
.order-row b{display:block;font-size:12.5px;color:var(--ink-0);}
.order-row small{display:block;color:var(--ink-2);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.order-side{display:grid;gap:4px;justify-items:end;}
.order-price{font:700 12.5px/1 var(--font-m);color:var(--brass);}
.order-badge{font-size:9px;font-weight:800;padding:3px 7px;border-radius:20px;background:var(--blue-dim);color:var(--blue);white-space:nowrap;}
.order-badge.hot{background:var(--crimson-dim);color:var(--crimson);}
.order-badge.bank{background:var(--violet-dim);color:var(--violet);}
.panel-link{display:inline-flex;align-items:center;gap:6px;margin-top:11px;color:var(--ink-1);font-size:11.5px;font-weight:600;cursor:pointer;transition:.15s color;}
.panel-link:hover{color:var(--brass);}
/* Fahrzeugbestand-Panel */
.stock-hero{position:relative;min-height:74px;overflow:hidden;margin-bottom:2px;}
.stock-count{font:800 36px/1 var(--font-m);color:var(--ink-0);}
.stock-count small{display:block;font:600 11px/1 var(--font-b);color:var(--ink-2);margin-top:6px;}
.stock-visual{position:absolute;right:-14px;top:-10px;width:200px;opacity:.5;pointer-events:none;}
.stock-breakdown{display:grid;gap:7px;margin:12px 0;}
.stock-line{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-1);padding:7px 11px;border-radius:9px;background:var(--surface);border:1px solid var(--line);}
.stock-line b{font:700 13px/1 var(--font-m);}
.stock-line.green b{color:var(--emerald);}
.stock-line.gold b{color:var(--brass);}
.stock-line.purple b{color:var(--violet);}
.stock-line.blue b{color:var(--blue);}
/* Offene Forderungen */
.claims-total{font:800 24px/1.1 var(--font-m);color:var(--crimson);margin-bottom:12px;}
.claims-total small{display:block;color:var(--ink-2);font:600 10.5px/1.3 var(--font-b);margin-top:5px;}
.claim-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 11px;border-radius:10px;background:var(--surface);border:1px solid var(--line);margin-bottom:7px;font-size:12px;cursor:pointer;transition:.15s border-color;}
.claim-row:hover{border-color:var(--line-hi);}
.claim-row > span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-0);}
.claim-row b{font:700 12px/1 var(--font-m);color:var(--ink-0);}
.claim-badge{font-size:9px;font-weight:800;padding:3px 8px;border-radius:20px;background:var(--crimson-dim);color:var(--crimson);white-space:nowrap;}
.claim-badge.scheduled{background:var(--brass-dim);color:var(--brass);}
/* Aktivitäten-Feed */
.activity-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);margin-bottom:7px;}
.activity-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:800 12px/1 var(--font-d);background:var(--blue-dim);color:var(--blue);}
.activity-ico.good{background:var(--emerald-dim);color:var(--emerald);}
.activity-ico.warn{background:var(--crimson-dim);color:var(--crimson);}
.activity-row small{color:var(--ink-1);font-size:11px;line-height:1.4;max-height:31px;overflow:hidden;}
.activity-row em{font-style:normal;color:var(--ink-2);font-size:9.5px;white-space:nowrap;align-self:start;margin-top:2px;}
/* Liniendiagramm (Business Insights) */
.chart-legend{display:flex;align-items:center;gap:14px;margin-bottom:10px;font-size:10.5px;color:var(--ink-1);font-weight:600;}
.chart-legend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
.chart-legend .revenue-sum{margin-left:auto;color:var(--ink-2);font-family:var(--font-m);font-size:10px;}
.line-chart{position:relative;height:170px;}
.line-chart svg{position:absolute;left:0;right:0;top:0;bottom:16px;width:100%;height:calc(100% - 16px);}
.line-cols{position:absolute;inset:0;display:flex;}
.line-col{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;outline:none;border-radius:6px;}
.line-col:hover,.line-col:focus{background:linear-gradient(180deg,rgba(255,255,255,.045),transparent 80%);}
.line-col small{color:var(--ink-2);font-size:9px;white-space:nowrap;padding-bottom:1px;}
.line-col .bar-tooltip{bottom:auto;top:4px;}
.line-col:hover .bar-tooltip,.line-col:focus .bar-tooltip{display:block;}

/* ---------- 11. POSTFACH / CHAT ---------- */
.mailbox-layout{display:flex;gap:14px;min-height:60vh;}
.convo-list{width:272px;flex:0 0 auto;overflow-y:auto;max-height:72vh;padding-right:6px;}
.convo-item{
  padding:11px 12px;border-radius:12px;cursor:pointer;margin-bottom:6px;
  border:1px solid transparent;transition:.15s all;
}
.convo-item:hover{background:var(--surface);}
.convo-item.active{background:var(--brass-dim);border-color:rgba(216,172,82,.35);}
.convo-item .top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;margin-bottom:3px;color:var(--ink-0);gap:8px;}
.convo-item .snippet{font-size:11.5px;color:var(--ink-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.unread-dot{width:7px;height:7px;border-radius:50%;background:var(--brass);display:inline-block;margin-left:7px;flex:0 0 auto;}
.chat-thread{
  flex:1;display:flex;flex-direction:column;min-width:0;
  background:linear-gradient(165deg,var(--panel-hi),var(--panel));
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;
}
.chat-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px;}
.chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;max-height:38vh;padding:2px;}
.bubble{max-width:74%;padding:10px 13px;border-radius:14px;font-size:12.5px;line-height:1.42;}
.bubble.customer{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;}
.bubble.player{align-self:flex-end;background:var(--brass-dim);border:1px solid rgba(216,172,82,.35);border-bottom-right-radius:4px;color:var(--ink-0);}
.chat-ai-status{
  align-self:flex-start;display:inline-flex;align-items:center;gap:8px;max-width:82%;
  padding:8px 11px;border-radius:999px;
  background:linear-gradient(135deg,var(--blue-dim),var(--surface));
  border:1px solid color-mix(in srgb,var(--blue) 25%, transparent);
  color:var(--ink-1);font-size:11.5px;font-weight:650;
}
.chat-ai-status .dots{display:inline-flex;gap:3px;}
.chat-ai-status .dots i{width:4px;height:4px;border-radius:50%;background:var(--ui-primary);animation:chatDot 1.05s infinite ease-in-out;}
.chat-ai-status .dots i:nth-child(2){animation-delay:.14s;}
.chat-ai-status .dots i:nth-child(3){animation-delay:.28s;}
@keyframes chatDot{0%,80%,100%{transform:translateY(0);opacity:.35;}40%{transform:translateY(-3px);opacity:1;}}
.customer-profile-strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
.customer-profile-strip .chip{font-size:10px;padding:3px 7px;}
.chat-actions{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px;border-top:1px solid var(--line);margin-top:10px;}

/* ---------- 12. MODALS ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(3,5,9,.62);backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;z-index:900;
}
body.theme-light .modal-overlay{background:rgba(30,41,59,.32);}
.modal{
  width:460px;max-width:92%;max-height:84%;overflow-y:auto;
  background:linear-gradient(170deg,var(--panel-hi),var(--panel));
  border:1px solid var(--line-hi);border-radius:var(--radius);padding:22px;
  box-shadow:var(--shadow-2), inset 0 1px 0 rgba(255,255,255,.05);
  animation:modalin .18s cubic-bezier(.2,.9,.3,1);
}
@keyframes modalin{from{opacity:0;transform:translateY(10px) scale(.985);}to{opacity:1;transform:translateY(0) scale(1);}}
/* Inserats-Modal */
.modal.listing-modal{width:640px;}
.listing-modal-shell{display:flex;flex-direction:column;min-height:0;max-height:74vh;}
.listing-modal-head{padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px;}
.listing-modal-scroll{overflow-y:auto;min-height:0;padding-right:4px;}
.listing-modal-actions{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
.listing-price-panel{display:grid;gap:12px;}
.listing-price-hero{
  display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;
  padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
}
.listing-price-hero .big{font:800 26px/1.1 var(--font-m);color:var(--brass);font-variant-numeric:tabular-nums;}
.grade{
  display:inline-block;padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:800;
  background:var(--surface-hi);border:1px solid var(--line-hi);color:var(--ink-0);
}
.listing-price-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;align-items:end;}
.listing-percent-row{display:grid;grid-template-columns:1fr 1.2fr;gap:12px;align-items:start;}
.listing-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.listing-metric{
  padding:10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);
  display:grid;gap:4px;min-width:0;
}
.listing-metric span{font-size:9.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.listing-metric b{font:700 12.5px/1.2 var(--font-m);color:var(--ink-0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.listing-metric.good{border-color:color-mix(in srgb,var(--emerald) 38%, transparent);background:var(--emerald-dim);}
.listing-metric.good b{color:var(--emerald);}
.listing-metric.warn{border-color:color-mix(in srgb,var(--crimson) 38%, transparent);background:var(--crimson-dim);}
.listing-metric.warn b{color:var(--crimson);}
/* Historien-Modal */
.modal.vehicle-history-modal{width:560px;}
.vehicle-history-shell{display:flex;flex-direction:column;min-height:0;max-height:72vh;}
.vehicle-history-head{padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px;}
.vehicle-history-body{overflow-y:auto;min-height:0;}
.vehicle-history-section{display:grid;gap:9px;}
.vehicle-history-title{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);}
.vehicle-history-scroll{max-height:46vh;}
.vehicle-history-actions{margin-top:14px;}

/* ---------- 13. BENACHRICHTIGUNGEN & TOASTS ---------- */
.notif-overlay{position:fixed;inset:0;background:rgba(3,5,9,.4);z-index:5000;}
body.theme-light .notif-overlay{background:rgba(30,41,59,.2);}
.notif-panel{
  position:absolute;top:70px;right:20px;width:344px;max-height:60vh;overflow-y:auto;
  background:linear-gradient(170deg,var(--panel-hi),var(--panel));
  border:1px solid var(--line-hi);border-radius:16px;padding:14px;
  box-shadow:var(--shadow-2), inset 0 1px 0 rgba(255,255,255,.05);
}
.notif-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.notif-head .x{cursor:pointer;color:var(--ink-2);font-size:15px;padding:2px 7px;border-radius:7px;}
.notif-head .x:hover{background:var(--surface-hi);color:var(--ink-0);}
.notif-item{padding:10px;border-radius:10px;margin-bottom:7px;background:var(--surface);font-size:12px;border:1px solid var(--line);line-height:1.45;}
.notif-item .t{color:var(--ink-2);font-size:10px;margin-top:3px;}
#toaststack{
  position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:720;
  display:flex;flex-direction:column;gap:6px;align-items:center;
  width:min(440px,calc(100vw - 240px));pointer-events:none;
}
.toast{
  display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:13px;width:100%;min-width:260px;
  background:linear-gradient(170deg,var(--panel-hi),var(--panel));
  border:1px solid rgba(216,172,82,.4);box-shadow:var(--shadow-1);
  font-size:12px;pointer-events:auto;line-height:1.4;
  animation:toastin .25s cubic-bezier(.2,.9,.3,1);
}
@keyframes toastin{from{opacity:0;transform:translateY(-12px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.toast .ic{font-size:18px;flex:0 0 auto;}
.toast .txt{flex:1;min-width:0;}
.toast .txt b{color:var(--brass);}
.toast-more{
  flex:0 0 auto;font-size:10.5px;font-weight:800;color:var(--brass-ink);
  background:linear-gradient(135deg,#ecd19d,var(--brass));border-radius:999px;padding:4px 8px;white-space:nowrap;
}

/* ---------- 14. ERFOLGE ---------- */
.achievement-stack{position:fixed;top:86px;right:22px;display:flex;flex-direction:column;gap:12px;z-index:4500;pointer-events:none;}
.achievement-popup{
  --ach:var(--brass);position:relative;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;
  width:min(390px,calc(100vw - 32px));padding:14px 16px;border-radius:14px;overflow:hidden;
  background:linear-gradient(170deg,var(--panel-hi),var(--panel));
  border:1px solid color-mix(in srgb,var(--ach) 58%, transparent);
  box-shadow:var(--shadow-2),0 0 36px color-mix(in srgb,var(--ach) 22%, transparent);
  animation:achievementIn .5s cubic-bezier(.17,.9,.24,1.18), achievementOut .38s ease-in 4.8s forwards;
}
.achievement-popup::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,.14) 42%,transparent 70%);transform:translateX(-115%);animation:achievementShine 1.6s ease .25s;}
.achievement-popup::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--ach),rgba(255,255,255,.85));animation:achievementTimer 5s linear forwards;}
.achievement-icon{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:27px;background:color-mix(in srgb,var(--ach) 18%, transparent);border:1px solid color-mix(in srgb,var(--ach) 54%, transparent);animation:achievementIcon .7s cubic-bezier(.2,1.2,.2,1);}
.achievement-copy{min-width:0;}
.achievement-kicker{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ach);font-weight:800;margin-bottom:3px;}
.achievement-title{font-family:var(--font-d);font-size:15px;font-weight:800;color:var(--ink-0);margin-bottom:3px;}
.achievement-desc{font-size:12px;color:var(--ink-1);line-height:1.35;}
.achievement-xp{display:inline-flex;margin-top:7px;padding:3px 7px;border-radius:20px;font-size:10.5px;font-weight:800;color:var(--brass-ink);background:linear-gradient(135deg,#ecd19d,var(--brass));}
@keyframes achievementIn{from{opacity:0;transform:translateX(34px) scale(.92);}to{opacity:1;transform:translateX(0) scale(1);}}
@keyframes achievementOut{to{opacity:0;transform:translateX(26px) scale(.96);}}
@keyframes achievementShine{to{transform:translateX(115%);}}
@keyframes achievementTimer{to{transform:scaleX(0);transform-origin:left;}}
@keyframes achievementIcon{0%{transform:scale(.45) rotate(-8deg);}60%{transform:scale(1.12) rotate(4deg);}100%{transform:scale(1) rotate(0);}}
@keyframes confettiFall{to{transform:translateY(165px) rotate(220deg);opacity:0;}}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:10px 0 20px;}
.ach-card{
  --ach:var(--brass);display:flex;gap:10px;align-items:flex-start;min-height:92px;
  background:var(--surface);border:1px solid color-mix(in srgb,var(--ach) 28%, var(--line));
  border-radius:var(--radius-sm);padding:12px;
}
.ach-card.locked{opacity:.45;filter:grayscale(1);border-color:var(--line);}
.ach-card .ach-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:21px;background:color-mix(in srgb,var(--ach) 16%, transparent);flex:0 0 auto;}
.ach-card .ach-name{font-family:var(--font-d);font-size:13px;font-weight:800;color:var(--ink-0);margin-bottom:3px;}
.ach-card .ach-desc{font-size:11.5px;color:var(--ink-1);line-height:1.35;}
.ach-card .ach-rarity{margin-top:6px;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ach);font-weight:800;}

/* ---------- 15. UPGRADES ---------- */
.upgrade-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.upgrade-card{
  display:grid;gap:10px;align-content:start;padding:16px;border-radius:14px;
  background:linear-gradient(165deg,var(--panel-hi),var(--panel));
  border:1px solid var(--line);transition:.15s border-color;
}
.upgrade-card:hover{border-color:var(--line-hi);}
.upgrade-card.locked{opacity:.55;}
.upgrade-card.maxed{border-color:rgba(216,172,82,.42);}
.upgrade-head{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:11px;align-items:center;}
.upgrade-icon{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  font:800 11px/1 var(--font-d);color:var(--brass);background:var(--brass-dim);
  border:1px solid rgba(216,172,82,.3);
}
.upgrade-head b{display:block;font-family:var(--font-d);font-size:13.5px;font-weight:800;color:var(--ink-0);}
.upgrade-head small{display:block;color:var(--ink-2);font-size:10.5px;margin-top:2px;}
.upgrade-desc{margin:0;color:var(--ink-1);font-size:11.5px;line-height:1.5;}
.upgrade-levels{display:flex;gap:5px;}
.upgrade-levels span{height:5px;flex:1;border-radius:99px;background:rgba(148,163,184,.18);}
.upgrade-levels span.on{background:linear-gradient(90deg,#ecc987,var(--brass));}
.upgrade-effect{
  padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);
  font-size:11.5px;color:var(--ink-1);line-height:1.5;
}
.upgrade-req{color:var(--ink-2);font-size:10.5px;}
.upgrade-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px;}
.upgrade-cost{font:700 14px/1 var(--font-m);color:var(--brass);}

/* ---------- 16. LEGACY ---------- */
.legacy-modal{
  width:min(980px,94vw);max-height:88vh;overflow:auto;padding:0;border-radius:18px;
  background:radial-gradient(circle at 18% 0,rgba(216,172,82,.2),transparent 32%),linear-gradient(160deg,var(--panel-hi),var(--panel));
  border:1px solid rgba(216,172,82,.42);
}
.legacy-hero{position:relative;padding:28px 30px 22px;overflow:hidden;border-bottom:1px solid rgba(216,172,82,.22);}
.legacy-hero:before{content:"";position:absolute;inset:auto -10% -45% -10%;height:190px;background:linear-gradient(90deg,transparent,rgba(216,172,82,.14),transparent);transform:skewY(-5deg);animation:legacySweep 2.8s ease-in-out infinite;}
.legacy-title{position:relative;margin:0;font-family:var(--font-d);font-size:30px;line-height:1.1;color:var(--ink-0);}
.legacy-kicker{position:relative;color:var(--brass);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.legacy-sub{position:relative;color:var(--ink-1);max-width:720px;line-height:1.45;margin:10px 0 0;}
.legacy-body{padding:22px 30px 28px;}
.legacy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0;}
.legacy-metric{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;}
.legacy-metric .lbl{font-size:11px;color:var(--ink-2);margin-bottom:6px;}
.legacy-metric .val{font-family:var(--font-d);font-size:22px;font-weight:800;color:var(--ink-0);}
.legacy-score-row{display:grid;grid-template-columns:160px 1fr 52px;gap:10px;align-items:center;margin:9px 0;}
.legacy-score-row .name{font-size:12px;color:var(--ink-1);font-weight:700;}
.legacy-score-row .pts{text-align:right;font-family:var(--font-m);font-weight:800;color:var(--brass);}
.legacy-bars{display:grid;gap:8px;margin:12px 0;}
.legacy-progress{height:10px;border-radius:999px;background:rgba(148,163,184,.16);overflow:hidden;border:1px solid var(--line);}
.legacy-progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--emerald),var(--brass));animation:legacyFill 1.1s cubic-bezier(.2,.9,.25,1) forwards;}
.legacy-history-table td,.legacy-history-table th{white-space:nowrap;}
.legacy-explain{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px;}
.legacy-explain .notice{margin:0;}
.legacy-explain-shell{display:grid;gap:10px;}
.legacy-explain-head{display:flex;align-items:center;gap:10px;}
.legacy-explain-icon{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  font:800 13px/1 var(--font-d);color:var(--violet);background:var(--violet-dim);
  border:1px solid color-mix(in srgb,var(--violet) 35%, transparent);
}
@keyframes legacySweep{0%,100%{opacity:.45;transform:translateX(-12%) skewY(-5deg);}50%{opacity:1;transform:translateX(12%) skewY(-5deg);}}
@keyframes legacyFill{to{width:var(--w);}}

/* ---------- 17. BANK-GLÜCKSRAD ---------- */
.wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin:14px 0 10px;}
.condition-wheel{
  position:relative;width:230px;height:230px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--emerald) 0deg 180deg,var(--crimson) 180deg 360deg);
  border:8px solid var(--surface-hi);box-shadow:var(--shadow-1),0 0 0 1px rgba(216,172,82,.28) inset;
  transform:rotate(0deg);transition:transform 4.2s cubic-bezier(.12,.72,.12,1);
}
.condition-wheel:before{content:"";position:absolute;inset:22px;border-radius:50%;background:color-mix(in srgb, var(--bg-1) 92%, transparent);border:1px solid var(--line-hi);}
.condition-wheel:after{content:"BANK";position:absolute;inset:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ecd19d,var(--brass));color:var(--brass-ink);font-family:var(--font-d);font-weight:900;letter-spacing:.04em;box-shadow:0 12px 26px rgba(0,0,0,.36);}
.wheel-label{position:absolute;z-index:2;font-family:var(--font-d);font-weight:900;font-size:13px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.55);text-align:center;width:74px;line-height:1.15;}
.wheel-label.accept{top:52px;right:32px;}
.wheel-label.reject{bottom:52px;left:32px;}
.wheel-pointer{width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--brass);filter:drop-shadow(0 5px 8px rgba(0,0,0,.45));margin-bottom:-4px;z-index:3;}
.wheel-result{font-family:var(--font-d);font-size:16px;font-weight:900;text-align:center;color:var(--brass);min-height:24px;}
.wheel-note{text-align:center;color:var(--ink-1);font-size:12px;line-height:1.45;max-width:420px;}

/* ---------- 18. LOGIN ---------- */
.profile-panel{
  width:min(760px,96vw);border-radius:18px;padding:24px;
  background:linear-gradient(170deg,var(--panel-hi),var(--panel));
  border:1px solid var(--line-hi);box-shadow:var(--shadow-2);
}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:16px 0;}
.profile-card{
  text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:14px;transition:.15s border-color,.15s background,.15s transform;
}
.profile-card:hover{border-color:rgba(216,172,82,.45);background:var(--surface-hi);transform:translateY(-1px);}
.profile-card .name{font-family:var(--font-d);font-weight:800;font-size:14px;margin-bottom:4px;}
.profile-card .meta{font-size:11.5px;color:var(--ink-1);line-height:1.45;}
.profile-card .unlock{display:flex;gap:8px;margin-top:10px;align-items:center;}
.profile-card input{
  min-width:0;flex:1;padding:8px 10px;border-radius:9px;background:var(--surface);
  border:1px solid var(--line);color:var(--ink-0);
}

/* ---------- 19. RESPONSIVE ---------- */
@media (max-width:1240px){
  .dash-main-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  .dash-right{grid-column:1 / -1;grid-template-columns:repeat(2,minmax(0,1fr));}
  .dash-kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
  .bottom-status{grid-template-columns:repeat(3,minmax(0,1fr));}
  .program-grid{grid-template-columns:repeat(3,minmax(120px,1fr));}
  .listing-metrics{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media (max-width:960px){
  .top-metrics .top-metric:nth-child(n+3){display:none;}
  .top-day{display:none;}
  .savebadge{display:none;}
  .bottom-tabs{margin-left:10px;}
  .dash-main-grid{grid-template-columns:1fr;}
  .dash-right{grid-column:auto;grid-template-columns:1fr;}
  .mailbox-layout{flex-direction:column;}
  .convo-list{width:auto;max-height:32vh;}
}
@media (max-width:760px){
  :root{--dock-w:72px;--top-h:64px;}
  #pagecontent{padding:14px;}
  .dock-item{width:58px;}
  .dock-item .lbl{display:none;}
  .ref-brand-copy{display:none;}
  .top-profile span:last-child{display:none;}
  .dash-kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .dash-car-row{grid-template-columns:1fr;}
  .bottom-status{grid-template-columns:1fr;}
  .bottom-tabs{display:none;}
  .program-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .program-head{grid-template-columns:1fr 38px;}
  .program-search{grid-column:1 / -1;grid-row:2;}
  .listing-price-grid,.listing-percent-row{grid-template-columns:1fr;}
  .listing-metrics{grid-template-columns:repeat(2,minmax(0,1fr));}
  #toaststack{top:70px;left:14px;right:14px;transform:none;width:auto;align-items:stretch;z-index:4000;}
  .toast{min-width:0;}
  .legacy-score-row{grid-template-columns:110px 1fr 44px;}
}

function uid(p){return p+'_'+Math.random().toString(36).slice(2,9);}
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function randFloat(a,b){return Math.random()*(b-a)+a;}
function choice(arr){return arr[randInt(0,arr.length-1)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, ch=>({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[ch]);
}
function escapeAttr(value){
  return escapeHtml(value).replace(/`/g, '&#96;');
}
function money(n){
  const neg = n<0; n=Math.abs(Math.round(n));
  const s = n.toLocaleString('de-DE');
  return (neg?'-':'')+s+' €';
}
function negativeMoney(n){
  n = Math.max(0, Math.round(n||0));
  return n>0 ? '-'+money(n) : money(0);
}
// Hält Schieberegler, Zahlenfeld und Anzeige-Label für Preis-Eingaben synchron.
// Regler bewegt -> Zahlenfeld & Label aktualisieren (sofort geklemmt).
function syncFromRange(prefix, val, min, max, varName){
  val = clamp(Math.round(+val||min), min, max);
  const n = document.getElementById(prefix+'Number');
  const l = document.getElementById(prefix+'lbl');
  if(n) n.value = val;
  if(l) l.textContent = money(val);
  window[varName] = val;
}
// Zahlenfeld getippt -> Regler & Label live mitziehen, OHNE das Zahlenfeld selbst
// während des Tippens zu überschreiben (sonst kann man keine mehrstelligen Zahlen eingeben).
function syncFromNumber(prefix, val, min, max, varName){
  let raw = (val===''||val===null) ? min : +val;
  if(isNaN(raw)) raw = min;
  const clamped = clamp(Math.round(raw), min, max);
  const r = document.getElementById(prefix+'Range');
  const l = document.getElementById(prefix+'lbl');
  if(r) r.value = clamped;
  if(l) l.textContent = money(clamped);
  window[varName] = clamped;
}
// Beim Verlassen des Zahlenfelds sichtbar auf einen gültigen Wert einrasten.
function snapNumberField(prefix, min, max, varName){
  const n = document.getElementById(prefix+'Number');
  if(!n) return;
  const clamped = clamp(Math.round(+n.value||min), min, max);
  n.value = clamped;
  window[varName] = clamped;
}

function applyTheme(){
  const mode = state && state.themeMode === 'light' ? 'light' : 'dark';

function setThemeMode(mode){
  state.themeMode = mode === 'light' ? 'light' : 'dark';
  applyTheme();
  renderAllOpen();
  scheduleSave();
}
function toggleThemeMode(){
  setThemeMode(state.themeMode === 'light' ? 'dark' : 'light');
}

  {level:0, key:'overdue', label:'Überfällig', feeKey:null, nextDays:0},
  {level:1, key:'reminder', label:'Zahlungserinnerung', feeKey:'reminder', nextDays:3},
  {level:2, key:'level1', label:'Mahnstufe 1', feeKey:'level1', nextDays:4},
  {level:3, key:'level2', label:'Mahnstufe 2', feeKey:'level2', nextDays:5},
  {level:4, key:'level3', label:'Mahnstufe 3', feeKey:'level3', nextDays:6},
  {level:5, key:'collection', label:'Inkasso', feeKey:'collection', nextDays:7},
  {level:6, key:'repossession', label:'Fahrzeugrücknahme', feeKey:'collection', nextDays:8},
  {level:7, key:'legal', label:'Gerichtsverfahren', feeKey:'legal', nextDays:10},
];
function dunningStep(level){ return DUNNING_STEPS[Math.min(level, DUNNING_STEPS.length-1)]; }
function dunningFee(level){
  const step = dunningStep(level);
  if(!step.feeKey) return 0;
  return +(state.dunningFees && state.dunningFees[step.feeKey] !== undefined ? state.dunningFees[step.feeKey] : defaultState().dunningFees[step.feeKey]) || 0;
}
function standardDunningFee(level){
  const step = dunningStep(level);
  if(!step.feeKey) return 0;
  return +(defaultState().dunningFees[step.feeKey] || 0);
}
function recordLegacyDunningFeeAdjustment(actualFee, level){
  const extra = Math.max(0, Math.round((actualFee||0) - standardDunningFee(level||0)));
  if(extra>0) state.legacyDunningFeeExtraIncome = (state.legacyDunningFeeExtraIncome||0) + extra;
  return extra;
}
function greedyDunningPressure(claim){
  if(!state.greedyDunningMode || !claim) return 0;
  return clamp((claim.fee||0)/Math.max(1, claim.baseAmount||1), 0, 3);
}
function contractDesc(contract){
  return contract.type==='leasing' ? contract.carSnapshot.brand+' '+contract.carSnapshot.model : contract.carDesc;
}
function activeClaims(){
  const fin = (state.receivables||[]).filter(r=>!r.closed && r.openClaim).map(r=>({kind:'fin', contract:r, claim:r.openClaim}));
  const lea = (state.leaseContracts||[]).filter(l=>l.status==='active' && l.openClaim).map(l=>({kind:'lea', contract:l, claim:l.openClaim}));
  return fin.concat(lea);
}
function claimTotal(claim){ return (claim.baseAmount||0) + (claim.fee||0); }
function claimStatusLabel(claim){ return dunningStep(claim.dunningLevel||0).label; }
function claimActionLabel(claim){
  const next = dunningStep((claim.dunningLevel||0)+1);
  if((claim.dunningLevel||0)>0 && state.day < (claim.nextActionDay||0)) return `${next.label} ab Tag ${claim.nextActionDay}`;
  return claim.actionRequired ? `${next.label} jetzt fällig` : `${next.label} ab Tag ${claim.nextActionDay}`;
}
function paymentDelayChance(contract){
  const base = clamp((state.paymentDelayPercent ?? 18)/100, 0, 1);
  const creditAdjustment = clamp((60-(contract.creditScore||60))/220, -0.14, 0.22);
  const dunningBonus = employeeBonus('Mahnwesen-Spezialist');
  return clamp(base + creditAdjustment - dunningBonus*0.04 - upgradeLevel('dunning_management')*0.03, 0, 0.98);
}
function createOpenClaim(contract, kind, amount){
  if(contract.openClaim) return addMissedRateToClaim(contract, amount);
  const desc = contractDesc(contract);
  contract.openClaim = {
    id: uid('claim'), kind, dueDay: state.day, baseAmount: amount, fee: 0,
    dunningLevel: 0, openRates: 1, rateItems: [{day:state.day, amount}],
    status: 'überfällig', actionRequired: true, nextActionDay: state.day,
    history: [{day:state.day, type:'missed', text:`Rate ${money(amount)} nicht eingegangen.`}],
  };
  contract.status = 'überfällig';
  notify(`${contract.customerName} hat die Rate für ${desc} nicht gezahlt. Mahnwesen prüfen.`,'warn');
  showToast('⚠', `<b>Rate überfällig</b><br>${contract.customerName}<br>${desc}<br>Fällige Rate: <b style="color:var(--crimson);">${money(amount)}</b>`, 'Verträge öffnen', ()=>navigateTo('contracts'));
  return contract.openClaim;
}
function addMissedRateToClaim(contract, amount){
  const claim = contract.openClaim;
  if(!claim) return createOpenClaim(contract, contract.type==='leasing'?'lea':'fin', amount);
  claim.baseAmount = (claim.baseAmount||0) + amount;
  claim.openRates = (claim.openRates||1) + 1;
  claim.rateItems = claim.rateItems || [];
  claim.rateItems.push({day:state.day, amount});
  claim.history = claim.history || [];
  claim.history.unshift({day:state.day, type:'missed', text:`Weitere Rate ${money(amount)} nicht eingegangen. Offene Raten: ${claim.openRates}.`});
  claim.actionRequired = (claim.dunningLevel||0)===0 || state.day >= (claim.nextActionDay||state.day);
  contract.status = 'überfällig';
  notify(`${contract.customerName}: weitere Rate für ${contractDesc(contract)} ist fällig und wurde zum Rückstand addiert.`,'warn');
  return claim;
}
function recordContractPayment(contract, amount, fee, label){
  contract.totalPaid = (contract.totalPaid||0)+amount+fee;
  contract.paymentHistory = contract.paymentHistory || [];
  contract.paymentHistory.unshift({day:state.day, amount, fee:fee||0, label:label||'Zahlung'});
  contract.paymentHistory = contract.paymentHistory.slice(0,20);
  addTx('income', `${label||'Rate'} ${contract.customerName} (${contractDesc(contract)})`, amount+fee);
}
function closeOpenClaim(contract, paidByDunning){
  const claim = contract.openClaim;
  if(!claim) return;
  const fee = claim.fee||0;
  const legacyFeeAdjustment = recordLegacyDunningFeeAdjustment(fee, claim.dunningLevel||0);
  if(contract.type==='finanzierung'){
    const monthlyRate = contract.nominalRate/12;
    const rates = Math.max(1, claim.openRates||1);
    for(let i=0;i<rates;i++){
      const interestPortion = Math.round(contract.remainingPrincipal*monthlyRate);
      let principalPortion = (contract.monthlyPayment||0) - interestPortion;
      if(principalPortion > contract.remainingPrincipal) principalPortion = contract.remainingPrincipal;
      if(principalPortion < 0) principalPortion = 0;
      contract.remainingPrincipal = Math.max(0, Math.round(contract.remainingPrincipal-principalPortion));
      contract.monthsElapsed = (contract.monthsElapsed||0)+1;
      contract.monthsRemaining = Math.max(0, contract.monthsRemaining-1);
      if(contract.remainingPrincipal<=0) break;
    }
  }
  recordContractPayment(contract, claim.baseAmount||0, fee, paidByDunning ? claimStatusLabel(claim)+' beglichen' : 'Monatsrate');
  if(legacyFeeAdjustment>0){
    claim.history = claim.history || [];
    claim.history.unshift({day:state.day, type:'legacy', text:`Legacy-Bewertung: ${money(legacyFeeAdjustment)} über Standard-Mahngebühr wird später nicht bewertet.`});
  }
  if(paidByDunning){
    state.claimsRecovered = (state.claimsRecovered||0)+1;
    addXp(28);
    trainEmployees('Mahnwesen-Spezialist', 35, 'offene Forderung eingezogen');
  }
  contract.openClaim = null;
  contract.dunningLevel = 0;
  contract.status = 'aktuell';
  if(contract.type==='finanzierung' && (contract.monthsRemaining<=0 || contract.remainingPrincipal<=0)){
    contract.status = 'abbezahlt';
    contract.closed = true;
    addXp(45);
    notify(`Finanzierung von ${contract.customerName} für ${contractDesc(contract)} ist vollständig abbezahlt.`,'good');
  }
  showToast('💳', `<b>Zahlung eingegangen</b><br>Kunde: ${contract.customerName}<br>${contractDesc(contract)}<br>${paidByDunning?claimStatusLabel(claim)+' erfolgreich beglichen':'Rate bezahlt'}<br>Offene Raten: ${claim.openRates||1} · Ratenbetrag: ${money(claim.baseAmount||0)}<br>Mahngebühr: ${money(fee)}<br><b style="color:var(--emerald);">Gesamt erhalten: +${money((claim.baseAmount||0)+fee)}</b>`, 'Verträge ansehen', ()=>navigateTo('contracts'));
  showAchievementUnlocks(checkAchievements());
}

function mixHexColor(hex, target, amount){
  const clean = String(hex||'#6f7d91').replace('#','');
  const other = String(target||'#ffffff').replace('#','');
  const expand = v => v.length===3 ? v.split('').map(ch=>ch+ch).join('') : v.padEnd(6,'0').slice(0,6);
  const a = expand(clean), b = expand(other);
  const channel = i => {
    const from = parseInt(a.slice(i,i+2),16);
    const to = parseInt(b.slice(i,i+2),16);

  };
